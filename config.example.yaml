# qbot 配置示例。复制为 config.yaml 后按需修改。
# API 密钥【不要】写在这里，放到 .env（见 .env.example）。

# 回测默认参数
backtest:
  initial_capital: 100000      # 初始资金
  fee_rate: 0.0005             # 单边手续费（万5，贴近 OKX 现货）
  slippage: 0.0005             # 单边滑点
  periods_per_year: 252        # 日线股票=252；加密日线建议 365

# 风控红线（决定你能不能活下来，改动务必谨慎）
risk:
  max_position_per_symbol: 0.20   # 单标的最大占比 20%
  stop_loss_pct: 0.08             # 单笔止损 8%
  take_profit_pct: 0.25           # 单笔止盈 25%
  max_portfolio_drawdown: 0.20    # 组合回撤 20% 触发熔断，全部清仓
  risk_per_trade: 0.01            # 每笔最多亏总资金 1%

# 实盘引擎
live:
  market: crypto                # crypto | ashare | synthetic
  symbol: BTC/USDT
  timeframe: 1d
  strategy: donchian            # ma_cross | rsi_reversion | donchian
  poll_seconds: 60              # 轮询间隔

# 关注的标的池（信号扫描用）
watchlist:
  crypto: [BTC/USDT, ETH/USDT, SOL/USDT, BNB/USDT]
  ashare: ["600519", "000001", "300750", "601318"]
