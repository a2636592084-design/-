<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>qbot 量化面板</title>
  <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
  <style>
    :root { --bg:#0e1117; --panel:#161b22; --panel2:#1c222b; --line:#30363d; --fg:#e6edf3;
            --up:#26a69a; --down:#ef5350; --accent:#58a6ff; --gold:#d6a545; --muted:#8b949e; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg);
           font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif; }
    .num { font-variant-numeric: tabular-nums; }
    header { padding:16px 24px; border-bottom:1px solid var(--line);
             display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
    header h1 { font-size:18px; margin:0; }
    header .warn { color:var(--muted); font-size:12px; }
    nav { display:flex; gap:4px; padding:12px 24px 0; }
    nav button { background:transparent; color:var(--muted); border:none; cursor:pointer;
                 padding:9px 18px; font-size:14px; border-bottom:2px solid transparent; }
    nav button.active { color:var(--fg); border-bottom-color:var(--accent); font-weight:600; }
    .view { display:none; } .view.active { display:block; }
    .controls { display:flex; gap:10px; align-items:end; flex-wrap:wrap;
                padding:16px 24px; border-bottom:1px solid var(--line); }
    .field { display:flex; flex-direction:column; gap:4px; }
    .field label { font-size:12px; color:var(--muted); }
    select, input, button, textarea { background:var(--panel); color:var(--fg);
             border:1px solid var(--line); border-radius:6px; padding:7px 10px; font-size:13px; }
    textarea { font-family:inherit; resize:vertical; min-height:38px; }
    .go { background:var(--accent); color:#04101f; font-weight:600; cursor:pointer; border:none; }
    .go:disabled { opacity:.5; cursor:not-allowed; }
    label.chk { flex-direction:row; align-items:center; gap:6px; color:var(--fg); font-size:13px; }
    .metrics { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
               gap:12px; padding:16px 24px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
    .card .k { font-size:12px; color:var(--muted); }
    .card .v { font-size:20px; font-weight:700; margin-top:4px; }
    .pos { color:var(--up); } .neg { color:var(--down); }
    #charts { padding:0 24px 24px; }
    .plot { background:var(--panel); border:1px solid var(--line);
            border-radius:10px; margin-top:16px; }
    .status { font-size:12px; color:var(--muted); padding:8px 24px 16px; }
    /* scan table */
    .scanwrap { padding:8px 24px 32px; overflow-x:auto; }
    table.scan { width:100%; border-collapse:collapse; font-size:13.5px; min-width:640px; }
    table.scan th, table.scan td { padding:11px 12px; text-align:right; white-space:nowrap;
                                   border-bottom:1px solid var(--line); }
    table.scan th:first-child, table.scan td:first-child { text-align:left; }
    table.scan th { font-size:11.5px; color:var(--muted); font-weight:600; letter-spacing:.03em; }
    table.scan td.sym { font-weight:600; }
    .sig { display:inline-block; padding:3px 11px; border-radius:999px; font-size:12px; font-weight:600; }
    .sig.buy { background:rgba(38,166,154,.16); color:var(--up); }
    .sig.flat { background:rgba(139,148,158,.16); color:var(--muted); }
    .sig.short { background:rgba(239,83,80,.16); color:var(--down); }
    tr.flip td { background:rgba(214,165,69,.09); }
    .flipbadge { color:var(--gold); font-size:11px; margin-left:6px; }
    .bar { display:inline-block; height:6px; border-radius:3px; vertical-align:middle;
           background:var(--accent); }
    .pf-h { font-size:13px; color:var(--muted); letter-spacing:.05em; margin:22px 0 8px;
            padding-bottom:6px; border-bottom:1px solid var(--line); }
    .pf-empty { padding:28px 24px; color:var(--muted); }
    .pf-empty .term { background:#0a1413; color:#cfe4e0; border-radius:8px; padding:12px 14px;
            margin:12px 0; font-family:ui-monospace,Consolas,monospace; font-size:13px; overflow-x:auto; }
    .pf-empty .hint { font-size:12px; color:var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>📈 qbot 量化面板</h1>
    <span class="warn">默认模拟盘 · 回测含手续费/滑点/防未来函数 · 不承诺任何收益</span>
  </header>

  <nav>
    <button id="tab-bt" class="active" onclick="switchTab('bt')">回测</button>
    <button id="tab-scan" onclick="switchTab('scan')">实时信号扫描</button>
    <button id="tab-paper" onclick="switchTab('paper')">模拟量化交易</button>
    <button id="tab-ashare" onclick="switchTab('ashare')">量化实盘A股</button>
    <button id="tab-crypto" onclick="switchTab('crypto')">量化实盘加密</button>
  </nav>

  <!-- ============ 回测视图 ============ -->
  <div id="view-bt" class="view active">
    <div class="controls">
      <div class="field"><label>市场</label>
        <select id="market">
          <option value="synthetic">合成(离线演示)</option>
          <option value="crypto">加密 OKX</option>
          <option value="ashare">A股</option>
        </select></div>
      <div class="field"><label>标的</label><input id="symbol" value="DEMO" size="12"></div>
      <div class="field"><label>周期</label>
        <select id="timeframe">
          <option value="1d">日线</option><option value="4h">4小时</option>
          <option value="1h">1小时</option><option value="15m">15分钟</option>
        </select></div>
      <div class="field"><label>策略</label><select id="strategy"></select></div>
      <div class="field"><label>年周期数</label><input id="ppy" value="252" size="5"></div>
      <div class="field"><label>ATR止损</label><input id="atrstop" placeholder="关" size="4"></div>
      <div class="field"><label>&nbsp;</label><button class="go" id="run">运行回测</button></div>
    </div>
    <div class="status" id="status">⚠️ 当前是「合成(离线演示)」<b>假数据</b>，只为演示、结果没有意义（这段假行情偏震荡，所以趋势策略会亏）。<b>要看真实结果，请把市场换成「加密 OKX」或「A股」</b>再回测。</div>
    <div class="metrics" id="metrics"></div>
    <div id="charts">
      <div class="plot" id="equityChart" style="height:360px"></div>
      <div class="plot" id="ddChart" style="height:220px"></div>
      <div class="plot" id="priceChart" style="height:320px"></div>
    </div>
  </div>

  <!-- ============ 实时扫描视图 ============ -->
  <div id="view-scan" class="view">
    <div class="controls">
      <div class="field"><label>市场</label>
        <select id="s_market">
          <option value="crypto">加密 OKX</option>
          <option value="ashare">A股</option>
          <option value="synthetic">合成(离线演示)</option>
        </select></div>
      <div class="field" style="flex:1;min-width:240px"><label>标的（逗号或换行分隔）</label>
        <textarea id="s_symbols">BTC/USDT, ETH/USDT, SOL/USDT, BNB/USDT</textarea></div>
      <div class="field"><label>周期</label>
        <select id="s_timeframe">
          <option value="1d">日线</option><option value="4h">4小时</option>
          <option value="1h">1小时</option><option value="15m">15分钟</option>
        </select></div>
      <div class="field"><label>策略</label><select id="s_strategy"></select></div>
      <div class="field"><label>ATR止损</label><input id="s_atrstop" placeholder="关" size="4"></div>
      <div class="field"><label>&nbsp;</label><button class="go" id="scan">扫描</button></div>
      <div class="field"><label class="chk"><input type="checkbox" id="s_auto">自动刷新60秒</label></div>
      <div class="field"><label class="chk"><input type="checkbox" id="s_notify" checked>🔔 信号变化时通知我</label></div>
    </div>
    <div class="status" id="s_status">
      填入标的、选策略，点"扫描"。系统对每个标的算出<b>当前该买/该卖/空仓</b>。
      🟡 高亮行 = 信号刚发生变化，重点关注。此页只给信号，不自动下单。
    </div>
    <div class="scanwrap">
      <table class="scan num" id="scanTable">
        <thead><tr>
          <th>标的</th><th>最新价</th><th>日涨跌</th><th>信号</th>
          <th>共振分</th><th>ADX</th><th>RSI</th><th>数据</th>
        </tr></thead>
        <tbody id="scanBody"></tbody>
      </table>
    </div>
  </div>

  <!-- ============ 组合交易视图（模拟/实盘A股/实盘加密 共用）============ -->
  <div id="view-paper" class="view"></div>
  <div id="view-ashare" class="view"></div>
  <div id="view-crypto" class="view"></div>

  <script>
    const pct = x => (x*100).toFixed(2) + '%';
    const num = x => (x==null?'-':Number(x).toFixed(2));

    const PF_META = {
      paper:  {title:'模拟量化交易', warn:'虚拟资金 · 覆盖加密与A股 · 零风险练手', run:'run_portfolio.py --mode paper'},
      ashare: {title:'量化实盘 A股', warn:'⚠️ 信号仅供参考 · A股不自动下单 · 请手动/半自动执行', run:'run_portfolio.py --mode ashare --market ashare --signals-only'},
      crypto: {title:'量化实盘 加密', warn:'⚠️ 真钱风险 · 需配好 OKX key · 默认模拟盘(demo) · 先跑稳再上真钱', run:'run_portfolio.py --mode crypto --market crypto --broker okx'},
    };

    async function loadPortfolio(mode){
      const box = document.getElementById('view-'+mode);
      const meta = PF_META[mode];
      let d;
      try { d = await (await fetch('/api/portfolio?mode='+mode)).json(); }
      catch(e){ box.innerHTML = `<div class="status">读取失败: ${e}</div>`; return; }

      if(!d.running){
        box.innerHTML = `
          <div class="controls"><div style="padding:6px 0">
            <b style="font-size:16px">${meta.title}</b>
            <div class="status" style="padding:8px 0">${meta.warn}</div></div></div>
          <div class="pf-empty">
            <p>引擎还没运行。在项目终端运行下面命令启动，本页会自动显示状态：</p>
            <div class="term"><span class="cmd">python ${meta.run} --strategy confluence --top 60</span></div>
            <p class="hint">${d.reason||''}</p>
          </div>`;
        return;
      }

      const posRows = (d.positions||[]).map(p=>`
        <tr><td class="sym">${p.symbol}</td>
          <td>${p.price}</td><td>${p.avg_price}</td>
          <td class="${p.pnl_pct>=0?'pos':'neg'}">${p.pnl_pct>=0?'+':''}${p.pnl_pct}%</td>
          <td>${p.amount}</td></tr>`).join('') ||
        `<tr><td colspan="5" style="color:var(--muted)">当前无持仓</td></tr>`;

      const scanRows = (d.scan||[]).slice(0,15).map(r=>{
        const sig = r.long ? '<span class="sig buy">🟢做多</span>' : '<span class="sig flat">⚪观望</span>';
        const sc = (r.strength>=0?'+':'')+Number(r.strength).toFixed(2);
        return `<tr class="${r.held?'flip':''}"><td class="sym">${r.symbol}${r.held?' <span class="flipbadge">持有中</span>':''}</td>
          <td>${r.price}</td><td class="${r.strength>0?'pos':(r.strength<0?'neg':'')}">${sc}</td>
          <td style="text-align:right">${sig}</td></tr>`;
      }).join('');

      const tradeRows = (d.recent_trades||[]).map(t=>`
        <tr><td style="color:var(--muted)">${t.ts}</td>
          <td class="${t.side==='buy'?'pos':'neg'}">${t.side==='buy'?'买入':'卖出'}</td>
          <td class="sym">${t.symbol}</td><td>${t.price}</td><td>${t.amount}</td></tr>`).join('') ||
        `<tr><td colspan="5" style="color:var(--muted)">暂无成交</td></tr>`;

      // 只出信号模式(A股)：把该买的清单直接列出来，而不是显示空持仓
      const suggestRows = (d.scan||[]).filter(r=>r.long).slice(0, d.max_positions).map(r=>`
        <tr><td class="sym">${r.symbol}</td><td>${r.price}</td>
          <td class="pos">+${Number(r.strength).toFixed(2)}</td></tr>`).join('') ||
        `<tr><td colspan="3" style="color:var(--muted)">当前无做多信号（空仓观望）</td></tr>`;
      const holdBlock = d.execute
        ? `<h3 class="pf-h">当前持仓</h3>
           <table class="scan num"><thead><tr><th>标的</th><th>现价</th><th>成本</th><th>浮盈</th><th>数量</th></tr></thead>
             <tbody>${posRows}</tbody></table>`
        : `<h3 class="pf-h">建议买入（手动下单 · 共振分最高的前 ${d.max_positions} 个做多信号）</h3>
           <table class="scan num"><thead><tr><th>标的</th><th>现价</th><th>共振分</th></tr></thead>
             <tbody>${suggestRows}</tbody></table>`;

      box.innerHTML = `
        <div class="controls" style="border:none">
          <div style="flex:1">
            <b style="font-size:16px">${meta.title}</b>
            <span class="status" style="padding:0 0 0 10px">${meta.warn}</span>
          </div>
          <div class="status">策略 ${d.strategy} · 扫描 ${d.scanned}/${d.universe_size} · 更新 ${d.ts}
            ${d.halted?'<span class="neg"> · 🛑组合熔断</span>':''}
            ${d.execute?'':'<span style="color:var(--gold)"> · 仅信号(手动)</span>'}</div>
        </div>
        <div class="metrics">
          <div class="card"><div class="k">净值</div><div class="v">${d.equity?.toLocaleString?.()??d.equity}</div></div>
          <div class="card"><div class="k">现金</div><div class="v">${d.cash?.toLocaleString?.()??d.cash}</div></div>
          ${d.execute
            ? `<div class="card"><div class="k">持仓数</div><div class="v">${(d.positions||[]).length}/${d.max_positions}</div></div>`
            : `<div class="card"><div class="k">做多信号</div><div class="v">${(d.scan||[]).filter(r=>r.long).length}</div></div>`}
          <div class="card"><div class="k">全市场</div><div class="v">${d.universe_size}</div></div>
        </div>
        <div class="scanwrap">
          ${holdBlock}
          <h3 class="pf-h">全市场扫描 · Top 信号（按共振分/强度）</h3>
          <table class="scan num"><thead><tr><th>标的</th><th>现价</th><th>强度</th><th>信号</th></tr></thead>
            <tbody>${scanRows}</tbody></table>
          <h3 class="pf-h">近期成交</h3>
          <table class="scan num"><thead><tr><th>时间</th><th>方向</th><th>标的</th><th>价格</th><th>数量</th></tr></thead>
            <tbody>${tradeRows}</tbody></table>
        </div>`;
    }

    const ALL_TABS = ['bt','scan','paper','ashare','crypto'];
    let pfTimer = null;
    function switchTab(t){
      ALL_TABS.forEach(x=>{
        const v = document.getElementById('view-'+x);
        const b = document.getElementById('tab-'+x);
        if(v) v.classList.toggle('active', x===t);
        if(b) b.classList.toggle('active', x===t);
      });
      clearInterval(pfTimer); pfTimer=null;
      if(['paper','ashare','crypto'].includes(t)){
        loadPortfolio(t);
        pfTimer = setInterval(()=>loadPortfolio(t), 30000);  // 每30秒刷新
      }
    }

    const STRAT_LABEL = {
      confluence: 'confluence · 多指标共振（推荐·EMA+MACD+RSI+布林+量价）',
      regime_switch: 'regime_switch · 自适应组合（趋势/震荡自动切换）',
      trend_stack: 'trend_stack · 趋势栈（EMA+ADX+MACD）',
      supertrend: 'supertrend · 超级趋势（含移动止损）',
      ma_cross: 'ma_cross · 双均线趋势',
      donchian: 'donchian · 唐奇安通道突破',
      rsi_reversion: 'rsi_reversion · RSI均值回归（震荡市）',
      bollinger_reversion: 'bollinger_reversion · 布林均值回归（震荡市）',
      vwap_momentum: 'vwap_momentum · VWAP日内动量（用15m/1h）',
    };
    async function loadStrategies(){
      let list = await (await fetch('/api/strategies')).json();
      // 把 confluence 排到最前，方便用户找到"多指标"策略
      list = list.slice().sort((a,b)=> (a==='confluence'?-1:0) - (b==='confluence'?-1:0));
      const opt = list.map(s=>`<option value="${s}">${STRAT_LABEL[s]||s}</option>`).join('');
      strategy.innerHTML = opt;
      s_strategy.innerHTML = opt;
      strategy.value = list.includes('confluence') ? 'confluence' : list[0];
      s_strategy.value = list.includes('confluence') ? 'confluence' : list[0];
    }

    /* ---------- 回测 ---------- */
    const METRIC_DEFS = [
      ['total_return','总收益',pct],['cagr','年化收益',pct],['max_drawdown','最大回撤',pct],
      ['sharpe','夏普',num],['sortino','索提诺',num],['calmar','卡玛',num],
      ['annual_vol','年化波动',pct],['win_rate','胜率',pct],
      ['profit_factor','盈利因子',num],['num_trades','交易次数',x=>x],
    ];
    function renderMetrics(m){
      metrics.innerHTML = METRIC_DEFS.map(([k,label,fmt])=>{
        const v = m[k];
        const cls = (['total_return','cagr','sharpe','sortino','calmar'].includes(k))
          ? (v>0?'pos':(v<0?'neg':'')) : (k==='max_drawdown'?'neg':'');
        return `<div class="card"><div class="k">${label}</div>
                <div class="v ${cls}">${v==null?'-':fmt(v)}</div></div>`;
      }).join('');
    }
    const layout = extra => Object.assign({
      paper_bgcolor:'#161b22', plot_bgcolor:'#161b22', font:{color:'#e6edf3'},
      margin:{l:55,r:20,t:36,b:36}, xaxis:{gridcolor:'#30363d'}, yaxis:{gridcolor:'#30363d'},
    }, extra);
    async function runBacktest(){
      run.disabled = true; status.textContent='回测中…';
      const p = new URLSearchParams({market:market.value, symbol:symbol.value,
        timeframe:timeframe.value, strategy:strategy.value, ppy:ppy.value});
      if(atrstop.value) p.set('atr_stop', atrstop.value);
      try {
        const d = await (await fetch('/api/backtest?'+p)).json();
        if(d.error){ status.textContent='错误: '+d.error; return; }
        renderMetrics(d.metrics);
        Plotly.newPlot('equityChart',[{x:d.dates,y:d.equity,type:'scatter',mode:'lines',
          line:{color:'#58a6ff',width:2},name:'资金曲线'}], layout({title:'资金曲线 (净值)'}),{responsive:true});
        Plotly.newPlot('ddChart',[{x:d.dates,y:d.drawdown.map(v=>v*100),type:'scatter',
          fill:'tozeroy',line:{color:'#ef5350'},name:'回撤%'}], layout({title:'回撤 (水下曲线, %)'}),{responsive:true});
        Plotly.newPlot('priceChart',[
          {x:d.dates,y:d.price,type:'scatter',line:{color:'#8b949e'},name:'价格'},
          {x:d.dates,y:d.position,type:'scatter',yaxis:'y2',line:{color:'#26a69a',shape:'hv'},name:'仓位'}],
          layout({title:'价格 vs 持仓',yaxis2:{overlaying:'y',side:'right',range:[-1.1,1.1],gridcolor:'transparent'}}),{responsive:true});
        status.textContent = `完成 · ${d.dates.length} 根K线 · ${d.dates[0]} ~ ${d.dates[d.dates.length-1]}`;
      } catch(e){ status.textContent='请求失败: '+e; }
      finally { run.disabled=false; }
    }

    /* ---------- 通知（浏览器弹窗 + 声音）---------- */
    function beep(){
      try {
        const ctx = new (window.AudioContext||window.webkitAudioContext)();
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type='sine'; o.frequency.value=880;
        g.gain.setValueAtTime(0.001, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime+0.02);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.4);
        o.start(); o.stop(ctx.currentTime+0.42);
      } catch(e){}
    }
    function notifyFlips(rows){
      if(!document.getElementById('s_notify').checked) return;
      const flips = rows.filter(r=>r.flipped && !r.error);
      if(!flips.length) return;
      beep();
      const body = flips.map(r=>{
        const s = r.target>0.5?'买入':(r.target<-0.5?'做空':'空仓');
        return `${r.symbol} → ${s}`;
      }).join('\n');
      if('Notification' in window && Notification.permission==='granted'){
        new Notification(`🔔 ${flips.length} 个信号变化`, {body});
      }
    }

    /* ---------- 扫描 ---------- */
    function sigCell(t){
      if(t>0.5) return '<span class="sig buy">🟢 买入 / 持有</span>';
      if(t<-0.5) return '<span class="sig short">🔴 做空</span>';
      return '<span class="sig flat">⚪ 空仓 / 观望</span>';
    }
    async function runScan(){
      scan.disabled = true; s_status.textContent='扫描中…';
      // 首次扫描时请求桌面通知授权
      if('Notification' in window && Notification.permission==='default'
         && document.getElementById('s_notify').checked){
        Notification.requestPermission();
      }
      const syms = s_symbols.value.split(/[,\n]/).map(x=>x.trim()).filter(Boolean).join(',');
      const p = new URLSearchParams({market:s_market.value, symbols:syms,
        strategy:s_strategy.value, timeframe:s_timeframe.value});
      if(s_atrstop.value) p.set('atr_stop', s_atrstop.value);
      try {
        const rows = await (await fetch('/api/scan?'+p)).json();
        if(rows.error){ s_status.textContent='错误: '+rows.error; return; }
        scanBody.innerHTML = rows.map(r=>{
          if(r.error) return `<tr><td class="sym">${r.symbol}</td>
            <td colspan="7" style="text-align:left;color:var(--down)">拉取失败: ${r.error}</td></tr>`;
          const chg = r.change>=0 ? `<span class="pos">+${pct(r.change)}</span>` : `<span class="neg">${pct(r.change)}</span>`;
          const flip = r.flipped ? '<span class="flipbadge">▲信号变化</span>' : '';
          const adxCls = r.adx>=25 ? 'pos' : (r.adx<20 ? 'muted' : '');
          let scoreCell = '<span style="color:var(--muted)">—</span>';
          if(r.score!=null){
            const cls = r.score>0.2?'pos':(r.score<-0.2?'neg':'');
            scoreCell = `<span class="${cls}">${r.score>=0?'+':''}${r.score.toFixed(2)}</span>`;
          }
          return `<tr class="${r.flipped?'flip':''}">
            <td class="sym">${r.symbol}${flip}</td>
            <td>${r.price.toLocaleString(undefined,{maximumFractionDigits:4})}</td>
            <td>${chg}</td>
            <td style="text-align:right">${sigCell(r.target)}</td>
            <td>${scoreCell}</td>
            <td class="${adxCls}">${r.adx.toFixed(1)}</td>
            <td>${r.rsi.toFixed(1)}</td>
            <td style="color:var(--muted)">${r.date} · ${r.bars}根</td>
          </tr>`;
        }).join('');
        notifyFlips(rows);
        const flips = rows.filter(r=>r.flipped).length;
        s_status.textContent = `完成 · ${rows.length} 个标的 · ${flips} 个信号变化 · ${new Date().toLocaleTimeString()}`;
      } catch(e){ s_status.textContent='请求失败: '+e; }
      finally { scan.disabled=false; }
    }

    let autoTimer = null;
    document.getElementById('s_auto').addEventListener('change', e=>{
      if(e.target.checked){ runScan(); autoTimer=setInterval(runScan,60000); }
      else { clearInterval(autoTimer); autoTimer=null; }
    });
    document.getElementById('s_market').addEventListener('change', e=>{
      const m=e.target.value;
      s_symbols.value = m==='ashare' ? '600519, 000001, 300750, 601318'
        : m==='synthetic' ? 'DEMO1, DEMO2, DEMO3' : 'BTC/USDT, ETH/USDT, SOL/USDT, BNB/USDT';
    });
    document.getElementById('market').addEventListener('change', e=>{
      const m=e.target.value;
      symbol.value = m==='crypto'?'BTC/USDT':(m==='ashare'?'600519':'DEMO');
      ppy.value = m==='crypto'?'365':'252';
      status.innerHTML = m==='synthetic'
        ? '⚠️ 当前是「合成(离线演示)」<b>假数据</b>，结果没有意义。要看真实结果请选「加密 OKX」或「A股」。'
        : `已选真实市场「${m==='crypto'?'加密 OKX':'A股'}」。填好标的、点"运行回测"（需联网/开加速器）。`;
    });
    document.getElementById('run').addEventListener('click', runBacktest);
    document.getElementById('scan').addEventListener('click', runScan);
    loadStrategies();
  </script>
</body>
</html>
